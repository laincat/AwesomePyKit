name: 发布

# main 推送和手动触发只构建；正式 Release 验证后保留最新一版。

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则按 git 标签/元数据推导）'
        required: false
        type: string

permissions:
  contents: read  # 构建无写权限；只有 publish 上传附件

# 连续推送时串行执行；不取消进行中的，避免产物推到一半被中断
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Same-SHA supported Python and executable validation
    if: github.event_name == 'release'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ----------------------------------------------------------------
  # 1. Python 分发包（sdist + wheel）
  # ----------------------------------------------------------------
  build-python-dist:
    name: 构建 Python 分发包
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.actual.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm 从 git 标签推导版本号，浅克隆拿不到标签
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          # normalize_version.py 依赖 packaging 判定 PEP 440 合法性，
          # build 会把它作为依赖带进来，这里显式列出以免依赖关系变动。
          python -m pip install build packaging

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # 只有「手动打 tag 发正式版」时才显式指定版本号。
          # 开发构建交给 setuptools_scm 从 git 标签推导。
          if [ '${{ github.event_name }}' = 'release' ]; then
            raw="$RELEASE_TAG"
          elif [ -n "$INPUT_VERSION" ]; then
            raw="$INPUT_VERSION"
          else
            raw=''
          fi

          if [ -n "$raw" ]; then
            # 标签是自由文本，必须先转成合法 PEP 440 版本号；直接丢给 setuptools
            # 会在构建深处抛 InvalidVersion，日志里看不出是标签命名的问题。
            version="$(python packaging/normalize_version.py "$raw")"
            echo "value=${version}" >> "$GITHUB_OUTPUT"
            echo "将使用版本号：${version}（来自标签 ${raw}）"
          else
            echo 'value=' >> "$GITHUB_OUTPUT"
            echo '未指定版本号，交给 setuptools_scm 推导'
          fi

      - name: 构建 sdist 与 wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.value }}
        run: python -m build --outdir dist-python

      - name: 校验分发包内容
        run: python packaging/check_dist.py dist-python

      - name: 报告实际版本号
        id: actual
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist-python/*.whl | head -1)"
          # wheel 文件名形如 awespykit-2.1.1.dev7-py3-none-any.whl
          version="$(basename "$wheel" | cut -d- -f2)"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "实际版本号：${version}"

      - name: 在干净环境里安装并导入
        run: |
          set -euo pipefail
          python -m venv /tmp/venv-check
          # Linux 上装不了 pywin32 / PyQt5 的 Windows 轮子，这里只验 wheel 本身
          # 能被解析安装（--no-deps 跳过平台相关依赖），以及元数据正确。
          /tmp/venv-check/bin/python -m pip install --no-deps dist-python/*.whl
          /tmp/venv-check/bin/python -c "import importlib.metadata as m; print('metadata ok:', m.version('Awespykit'))"

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist-python/*
          retention-days: 14

  # ----------------------------------------------------------------
  # 2. Windows 单文件可执行程序
  # ----------------------------------------------------------------
  build-windows-exe:
    name: 构建 Windows exe
    runs-on: windows-latest
    outputs:
      version: ${{ steps.actual.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          # 固定版本：exe 一旦发布出去就该是可复现的，
          # 换 Python 小版本会改变打包结果与体积。
          python-version: '3.13'

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'release' ]; then
            raw="$RELEASE_TAG"
          elif [ -n "$INPUT_VERSION" ]; then
            raw="$INPUT_VERSION"
          else
            raw=''
          fi

          if [ -n "$raw" ]; then
            version="$(python packaging/normalize_version.py "$raw")"
            echo "value=${version}" >> "$GITHUB_OUTPUT"
            echo "AWESPY_VERSION=${version}" >> "$GITHUB_ENV"
            echo "将使用版本号：${version}（来自标签 ${raw}）"
          else
            echo 'value=' >> "$GITHUB_OUTPUT"
            echo 'AWESPY_VERSION=' >> "$GITHUB_ENV"
            echo '未指定版本号，交给 setuptools_scm 推导'
          fi

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 记录依赖版本（便于排查「换个环境就崩」）
        run: python -m pip freeze

      - name: 设定版本号并生成版本信息
        shell: bash
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # exe 里的版本号由包元数据提供，所以先把包以正确版本装进来
          python -m pip install --no-deps .
          python packaging/make_version_info.py
          cat packaging/version_info.txt

      - name: 报告实际版本号
        id: actual
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import importlib.metadata as m; print(m.version('Awespykit'))")"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "实际版本号：${version}"

      - name: 构建单文件 exe
        run: python -m PyInstaller --noconfirm --clean packaging/awespykit.spec

      - name: 冒烟测试 exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # exe 是窗口程序，不会自己退出。能撑过 15 秒 = 资源与子包都加载成功；
          # 只要缺资源或缺子包，进程会在启动瞬间就死掉，这里立刻失败。
          $proc = Start-Process -FilePath 'dist/Awespykit.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Error "exe 启动即退出（退出码 $($proc.ExitCode)），打包内容可能不完整"
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'exe 冒烟测试通过'
          (Get-Item 'dist/Awespykit.exe').VersionInfo |
            Select-Object FileVersion, ProductVersion, FileDescription |
            Format-List

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum Awespykit.exe > Awespykit.exe.sha256
          cat Awespykit.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: |
            dist/Awespykit.exe
            dist/Awespykit.exe.sha256
          retention-days: 14

  # ----------------------------------------------------------------
  # 3. 发布
  # ----------------------------------------------------------------
  publish:
    name: 发布到 Release
    if: github.event_name == 'release'
    needs: [validate, build-python-dist, build-windows-exe]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 整理附件并检查版本一致
        shell: bash
        env:
          PYTHON_VERSION: ${{ needs.build-python-dist.outputs.version }}
          EXE_VERSION: ${{ needs.build-windows-exe.outputs.version }}
        run: |
          set -euo pipefail
          test "$PYTHON_VERSION" = "$EXE_VERSION"
          mkdir -p upload
          cp artifacts/python-dist/* upload/
          cp artifacts/windows-exe/* upload/
          cd upload
          sha256sum *.tar.gz *.whl > python-dist.sha256
      - name: 上传正式版附件
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" upload/* --clobber
      - name: 验证发布并清理旧版本
        if: github.event.release.prerelease == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build-windows-exe.outputs.version }}
        run: python3 .github/scripts/prune_releases.py
