name: Dependabot 自动合并（仅 patch）

# 只自动合并 patch 级依赖更新：CI 全绿才合，其它一律留给人看。
#
# ── 为什么不用 `gh pr merge --auto` ────────────────────────────────────────
# 直觉写法是 `--auto`，让 GitHub「等检查过了再合」。但在这个仓库里那样写是
# 危险的：gh CLI 对 `--auto` 的实现是
#     autoMerge: opts.AutoMergeEnable && !isImmediatelyMergeable(pr.MergeStateStatus)
# 也就是说，**PR 处于 CLEAN（没有任何未满足的必需条件）时，--auto 会直接
# 立刻合并，而不是挂起等待**（cli/cli#8792 有官方确认）。
#
# 而本仓库的 main 分支没有开启分支保护（2026-09-26 实测：branches/*/protection
# 返回 Branch not protected），于是既没有 required status checks、也没有
# required reviews —— Dependabot 的 PR 天然就是 CLEAN，`--auto` 会立刻合并，
# 等于完全没有检查。
#
# 所以这里改成显式三步：先确认 CI 真的通过，再确认可合并，最后才 merge。
# 换句话说，**等待 CI 的职责由本文件承担**，而不是交给 GitHub。
#
# 硬底线：major 绝不能自动合，minor 也留人工。这个项目的交付物是要发给真实
# 用户的 exe，打包工具链（PyInstaller、PyQt5）的 minor 升级就可能改变产物
# 行为。所以只有 patch 进入自动流程。

on: pull_request

permissions:
  contents: write
  pull-requests: write
  # 读检查结果（下面要等 CI 跑完）需要这个权限
  checks: read
  actions: read

jobs:
  auto-merge:
    # 用 user.login 而不是 github.actor：前者是 PR 的作者，后者是「谁触发了
    # 本次运行」，Dependabot 自己推更新时会变化，判据不稳。
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 读取依赖更新元数据
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 判定是否为 patch
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo "update-type  = ${{ steps.meta.outputs.update-type }}"
          echo "依赖类型    = ${{ steps.meta.outputs.dependency-type }}"
          echo "依赖列表    = ${{ steps.meta.outputs.dependency-names }}"
          if [ '${{ steps.meta.outputs.update-type }}' = 'version-update:semver-patch' ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            echo '→ 不是 patch，按策略留人工 review。'
          fi

      - name: 等待 CI 检查结束
        id: checks
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -uo pipefail
          # PR 刚创建时 CI 还没开始，checks 列表可能是空的。
          # 先等一会儿让检查注册进来，否则 --watch 会立刻返回「没有检查」并放行。
          for attempt in $(seq 1 20); do
            count="$(gh pr checks "$PR_URL" --json name --jq 'length' 2>/dev/null || echo 0)"
            if [ "${count:-0}" -gt 0 ]; then
              echo "已注册 ${count} 项检查"
              break
            fi
            echo "等待检查注册…（$attempt/20）"
            sleep 15
          done

          # --watch 会等到全部检查跑完才返回；有失败则返回非 0。
          if gh pr checks "$PR_URL" --watch --interval 20; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
            echo '✅ 所有 CI 检查通过'
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            echo '::warning::CI 未通过或超时，跳过自动合并，留人工处理。'
          fi
          # 无论结果如何都打印一份明细，方便事后追溯
          gh pr checks "$PR_URL" || true

      - name: 确认可合并（防冲突 / 防 draft）
        id: ready
        if: steps.gate.outputs.ok == 'true' && steps.checks.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          # mergeable 由 GitHub 异步计算，首次查询常常是 UNKNOWN，需要轮询
          state=''
          for _ in $(seq 1 10); do
            state="$(gh pr view "$PR_URL" --json mergeable,isDraft \
              --jq 'if .isDraft then "DRAFT" else .mergeable end')"
            [ "$state" != 'UNKNOWN' ] && break
            echo 'mergeable=UNKNOWN，等待 3s 后重试'
            sleep 3
          done
          echo "mergeable 状态: $state"
          if [ "$state" != 'MERGEABLE' ]; then
            echo "::error::PR 当前不可合并（$state），跳过自动合并。"
            exit 1
          fi

      - name: 执行合并（squash）
        if: steps.gate.outputs.ok == 'true' && steps.checks.outputs.ok == 'true' && steps.ready.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # --match-head-commit 作纵深防御：万一在「判定」到「合并」之间有人
          # 往这个 PR 追加了提交，head 不再匹配，GitHub 会拒绝合并。
          gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
          echo "✅ 已合并（patch 级，head=$HEAD_SHA）"

      - name: 删除已合并的分支
        if: steps.gate.outputs.ok == 'true' && steps.checks.outputs.ok == 'true' && steps.ready.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        continue-on-error: true
        run: |
          # 用 API 删远端分支，不用 `--delete-branch`：后者操作的是**本地**分支，
          # 而 runner 上并没有那个分支，存在删错分支的历史问题（cli/cli#8362）。
          if gh api -X DELETE \
               "repos/${{ github.repository }}/git/refs/heads/$BRANCH" 2>/dev/null; then
            echo "已删除分支 $BRANCH"
          else
            echo "分支 $BRANCH 删除失败或已不存在（不影响合并结果）"
          fi
